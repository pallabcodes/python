# Development environment overrides

version: '3.8'

services:
  analytics-pipeline:
    environment:
      - PYTHONPATH=/app
      - PIPELINE_ENV=development
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
    command: ["python", "-m", "uvicorn", "output.api_endpoints:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  postgres:
    environment:
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
