repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.9
        args: ['--line-length=100']

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--max-complexity=10']
        additional_dependencies: [
          'flake8-docstrings',
          'flake8-bugbear',
          'flake8-comprehensions',
          'flake8-simplify',
        ]

  - repo: https://github.com/pre-commit/mirrors-pylint
    rev: v3.0.2
    hooks:
      - id: pylint
        args: ['--max-line-length=100', '--disable=C0111,C0114,C0115,C0116']
        additional_dependencies: [
          'pylint-django',
        ]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [
          'types-requests',
          'types-PyYAML',
          'fastapi',
          'pydantic',
        ]
        args: ['--strict', '--show-error-codes', '--ignore-missing-imports']

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-mock-methods
      - id: python-no-eval
      - id: python-no-log-warn
      - id: text-unicode-replacement-char

  - repo: local
    hooks:
      - id: check-file-size
        name: Check file size limits
        entry: bash -c 'for file in "$@"; do lines=$(wc -l < "$file"); if [ "$lines" -gt 200 ]; then echo "ERROR: $file exceeds 200 lines ($lines lines)"; exit 1; fi; done'
        language: system
        files: \.py$
        pass_filenames: true

      - id: check-function-size
        name: Check function size limits
        entry: python -c "import ast, sys; [print(f'ERROR: Function {node.name} in {f} exceeds 50 lines') or sys.exit(1) for f in sys.argv[1:] for node in ast.walk(ast.parse(open(f).read())) if isinstance(node, ast.FunctionDef) and node.end_lineno and node.lineno and (node.end_lineno - node.lineno) > 50]"
        language: system
        files: \.py$
        pass_filenames: true

