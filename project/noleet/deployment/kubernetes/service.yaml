apiVersion: v1
kind: Service
metadata:
  name: noleet-app
  namespace: noleet
  labels:
    app: noleet
    component: app
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8000
    protocol: TCP
    name: https
  selector:
    app: noleet
    component: app

---
apiVersion: v1
kind: Service
metadata:
  name: noleet-app-headless
  namespace: noleet
  labels:
    app: noleet
    component: app
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: noleet
    component: app

