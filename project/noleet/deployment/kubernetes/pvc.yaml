apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: noleet-data-pvc
  namespace: noleet
  labels:
    app: noleet
    component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard

