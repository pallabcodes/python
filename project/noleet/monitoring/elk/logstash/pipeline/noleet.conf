input {
  http {
    port => 8080
    codec => json
  }

  tcp {
    port => 5000
    codec => json_lines
  }

  file {
    path => "/var/log/noleet/*.log"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb"
    codec => multiline {
      pattern => "^%{TIMESTAMP_ISO8601}"
      negate => true
      what => "previous"
    }
  }
}

filter {
  # Parse JSON logs
  json {
    source => "message"
    target => "parsed"
  }

  # Add timestamp if not present
  if ![parsed][timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Add service information
  if [parsed][service] {
    mutate {
      add_field => { "service_name" => "%{[parsed][service]}" }
    }
  }

  # Parse log levels
  grok {
    match => { "message" => "%{LOGLEVEL:log_level}" }
  }

  # Extract user information
  if [parsed][user_id] {
    mutate {
      add_field => { "user.id" => "%{[parsed][user_id]}" }
      add_field => { "user.session_id" => "%{[parsed][session_id]}" }
    }
  }

  # Extract request information
  if [parsed][request_id] {
    mutate {
      add_field => { "request.id" => "%{[parsed][request_id]}" }
      add_field => { "request.method" => "%{[parsed][method]}" }
      add_field => { "request.path" => "%{[parsed][path]}" }
      add_field => { "request.status_code" => "%{[parsed][status_code]}" }
      add_field => { "request.duration" => "%{[parsed][duration]}" }
    }
  }

  # Extract LLM information
  if [parsed][llm] {
    mutate {
      add_field => { "llm.provider" => "%{[parsed][llm][provider]}" }
      add_field => { "llm.model" => "%{[parsed][llm][model]}" }
      add_field => { "llm.tokens_used" => "%{[parsed][llm][tokens_used]}" }
      add_field => { "llm.cost_usd" => "%{[parsed][llm][cost_usd]}" }
    }
  }

  # Extract agent information
  if [parsed][agent] {
    mutate {
      add_field => { "agent.name" => "%{[parsed][agent][name]}" }
      add_field => { "agent.operation" => "%{[parsed][agent][operation]}" }
      add_field => { "agent.duration" => "%{[parsed][agent][duration]}" }
    }
  }

  # Extract error information
  if [parsed][error] {
    mutate {
      add_field => { "error.type" => "%{[parsed][error][type]}" }
      add_field => { "error.message" => "%{[parsed][error][message]}" }
      add_field => { "error.stack_trace" => "%{[parsed][error][stack_trace]}" }
    }
  }

  # Extract performance metrics
  if [parsed][performance] {
    mutate {
      add_field => { "performance.operation" => "%{[parsed][performance][operation]}" }
      add_field => { "performance.duration" => "%{[parsed][performance][duration]}" }
      add_field => { "performance.memory_used" => "%{[parsed][performance][memory_used]}" }
      add_field => { "performance.cpu_used" => "%{[parsed][performance][cpu_used]}" }
    }
  }

  # Add geo information for IP addresses
  if [parsed][ip_address] {
    geoip {
      source => "[parsed][ip_address]"
      target => "geo"
    }
  }

  # Add user agent parsing
  if [parsed][user_agent] {
    useragent {
      source => "[parsed][user_agent]"
      target => "user_agent"
    }
  }

  # Remove sensitive information
  mutate {
    remove_field => ["parsed", "password", "token", "api_key", "secret"]
  }
}

output {
  # Main Elasticsearch output
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "noleet-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # Debug output for development
  if "_grokparsefailure" in [tags] {
    file {
      path => "/var/log/logstash/grok-failures.log"
    }
  }

  # Error logs to separate index
  if [log_level] == "ERROR" or [log_level] == "CRITICAL" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "noleet-errors-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }

  # Performance logs to separate index
  if [performance] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "noleet-performance-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }

  # LLM logs to separate index
  if [llm] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "noleet-llm-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }
}
