[project]
name = "python-mastery"
version = "0.1.0"
description = "A high-signal Python3 knowledgebase for senior systems engineers."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "cachetools>=5.3.0",
    "selenium>=4.15.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
