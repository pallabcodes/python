# Alembic configuration file for database migrations.

[alembic]
# Where Alembic migration scripts are stored
script_location = alembic

# How migration file names are generated (default is revision and slug)
# file_template = ... (optional, commented out)

# Add current directory to Python path
prepend_sys_path = .

# Separator for multiple version locations (default is OS-specific)
version_path_separator = os

# The database URL Alembic will use for migrations
sqlalchemy.url = sqlite:///./todosapp.db

# Logging configuration for Alembic and SQLAlchemy
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
